<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiveClean | Let's clean the sea together!</title>
    <link
      rel="shortcut icon"
      href="./assets/DiveClean-logo.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav>
      <a href="./index.html"
        ><img src="./assets/DiveClean-logo.svg" alt="" /> DiveClean</a
      >
      <a href="./profile.html"
        ><img src="./assets/icons/personal.svg" alt="personal"
      /></a>
    </nav>
    <main class="report-main">
      <section class="report-header">
        <a href="./dive.html">
          <span class="icon icon--arrowl"></span>
        </a>
        <h1>Afval melden</h1>
      </section>

      <section class="steps">
        <div class="step">
          <span class="step-number current">1</span>
          <span class="step-label">Foto</span>
        </div>

        <div class="step">
          <span class="step-number">2</span>
          <span class="step-label">Details</span>
        </div>

        <div class="step">
          <span class="step-number">3</span>
          <span class="step-label">Versturen</span>
        </div>
      </section>

      <section class="photo-section">
        <label for="camera-input" class="photo-button">
          <span class="icon icon--camera"></span>
          <span>Maak een foto <br />van het afval</span>
        </label>

        <input
          type="file"
          id="camera-input"
          accept="image/*"
          capture="environment"
          hidden
        />
      </section>

      <section class="reason-section">
        <h2></h2>

        <div class="reason-options">
          <button class="reason">
            <span class="icon icon--weight"></span>
            <span>Te zwaar</span>
          </button>

          <button class="reason">
            <span class="icon icon--large"></span>
            <span>Te groot</span>
          </button>

          <button class="reason">
            <span class="icon icon--danger"></span>
            <span>Scherp/<br />Gevaarlijk</span>
          </button>

          <button class="reason">
            <span class="icon icon--stuck"></span>
            <span>Vastzittend</span>
          </button>
        </div>
      </section>

      <a href="" class="next-button">
        <span>Volgende</span>
        <span class="icon icon--arrowr"></span>
      </a>
    </main>
    <footer>
      <a href="./index.html" class="active"
        ><span class="icon icon--home"></span
      ></a>
      <a href="./dive.html"><span class="icon icon--diving"></span></a>
      <a href="./scan.html"><span class="icon icon--scan"></span></a>
      <a href="./impact.html"><span class="icon icon--stats"></span></a>
    </footer>
  </body>
</html>
