<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiveClean | Diving</title>
    <link rel="shortcut icon" href="./assets/DiveClean-logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>
    <script src="./js/dive-timer.js" defer></script>
</head>
<body>
    <nav>
        <a href="./index.html"><img src="./assets/DiveClean-logo.svg" alt=""> DiveClean</a>
        <a href="./profile.html"><img src="./assets/icons/personal.svg" alt="personal"></a>
    </nav>

    <main>
        <header>
            <h1>Currently diving</h1>
            <p>Enjoy your dive!</p>
        </header>

        <div class="timer">
            <h2>You have been diving for:</h2>
            <span id="timer">00:00</span>

            <div class="timer-actions">

                <button
                    id="start-dive"
                    class="button button--primary"
                >
                    <span class="icon-s icon--play"></span>
                    Start dive
                </button>

                <button
                    id="pause-dive"
                    class="button button--primary"
                    hidden
                >
                    <span class="icon-s icon--pause"></span>
                    Pause dive
                </button>

                <div
                    id="pause-actions"
                    class="pause-actions"
                    hidden
                >
                    <button
                        id="reset-dive"
                        class="button button--secondary"
                    >
                    <span class="icon-s icon--reset"></span>
                        Reset
                    </button>

                    <button
                        id="resume-dive"
                        class="button button--resume"
                    >
                        <span class="icon-s icon--play"></span>
                        Resume
                    </button>

                    <button
                        id="finish-dive"
                        class="button button--finish"
                    >
                        <span class="icon-s icon--finish"></span>
                        Finish
                    </button>
                </div>

            </div>
        </div>

        <section>
            <div class="safety">
                <span class="icon icon--alert-circle"></span>
                <article>
                    <h2>Safety first!</h2>
                    <p>Only take trash with you if it is safe!</p>
                </article>
            </div>

            <a class="report" href="./scan.html"><span class="icon icon--flag"></span>Report trash</a>
        </section>

        <section>
            <div>
                <img src="" alt="">
                <article>                    
                    <h2>Location</h2>
                    <p>...</p>
                </article>
            </div>
        </section>

    </main>

    <footer>
        <a href="./index.html"><span class="icon icon--home"></span></a>
        <a href="./diving.html" class="active"><span class="icon icon--diving"></span></a>
        <a href="./scan.html"><span class="icon icon--scan"></span></a>
        <a href="./impact.html"><span class="icon icon--stats"></span></a>
    </footer>
</body>
</html>
