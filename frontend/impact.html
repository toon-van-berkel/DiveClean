<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiveClean | My impact</title>
    <link rel="shortcut icon" href="./assets/DiveClean-logo.svg">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>
    <script src="./js/impact.js" defer></script>
</head>
<body>
    <nav>
        <a href="./index.html">
            <img src="./assets/DiveClean-logo.svg" alt="">
            DiveClean
        </a>

        <a href="./index.html" aria-label="Profile">
            <img src="./assets/icons/personal.svg" alt="">
        </a>
    </nav>

    <main>
        <header class="page-header">
            <p class="eyebrow">Your contribution</p>
            <h1>My impact</h1>
            <p>Small actions add up to a cleaner underwater world.</p>
        </header>

        <section class="dashboard-grid">
            <article class="card impact-card">
                <p class="eyebrow">Total removed</p>
                <strong id="impact-total-waste">0 kg</strong>
                <span>all time</span>
            </article>

            <article class="card">
                <p class="eyebrow">Dives</p>
                <strong id="impact-total-dives">0</strong>
                <span>completed</span>
            </article>
        </section>

        <section class="card stats-card">
            <h2>Impact over time</h2>

            <div class="period-tabs" role="tablist">
                <button class="period-tab active" data-period="month">
                    This month
                </button>

                <button class="period-tab" data-period="year">
                    This year
                </button>
            </div>

            <div id="period-summary" class="stat-row">
            </div>
        </section>

        <a class="button button--primary button-link" href="./diving.html">
            <span class="icon-s icon--play"></span>
            Start another dive
        </a>
    </main>

    <footer>
        <a href="./index.html">
            <span class="icon icon--home"></span>
        </a>

        <a href="./diving.html">
            <span class="icon icon--diving"></span>
        </a>

        <a href="./scan.html">
            <span class="icon icon--scan"></span>
        </a>

        <a href="./impact.html" class="active">
            <span class="icon icon--stats"></span>
        </a>
    </footer>
</body>
</html>
