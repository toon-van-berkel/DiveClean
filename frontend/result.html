<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiveClean | Dive result</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>
    <script src="./js/result.js" defer></script>
</head>
<body>
    <nav>
        <a href="./index.html">
            <img src="./assets/DiveClean-logo.svg" alt=""> DiveClean
        </a>
    </nav>

    <main class="result-page">
        <section class="result-content" aria-labelledby="result-title">
            <div class="result-check" aria-hidden="true">✓</div>
            <p class="eyebrow">Dive complete</p>
            <h1 id="result-title">Good work!</h1>
            <p class="result-message">You helped us clean the ocean some more.</p>

            <div class="result-summary">
                <div class="result-stat">
                    <span class="result-stat__icon" aria-hidden="true">★</span>
                    <div>
                        <strong id="dive-points">+0</strong>
                        <span>DivePoints</span>
                    </div>
                </div>
                <div class="result-stat">
                    <span class="result-stat__icon" aria-hidden="true">◷</span>
                    <div>
                        <strong id="dive-duration">00:00</strong>
                        <span>dive duration</span>
                    </div>
                </div>
            </div>

            <button id="save-dive" class="button button--primary result-impact-button" type="button">
                Bekijk je impact <span aria-hidden="true">→</span>
            </button>
        </section>
    </main>

    <footer>
        <a href="./index.html"><span class="icon icon--home"></span></a>
        <a href="./diving.html"><span class="icon icon--diving"></span></a>
        <a href="./scan.html"><span class="icon icon--scan"></span></a>
        <a href="./impact.html" class="active"><span class="icon icon--stats"></span></a>
    </footer>
</body>
</html>
